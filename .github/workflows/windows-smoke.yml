name: Windows smoke test

on:
  push:
    branches: [main, feat/unified-proxy-repair]
  pull_request:

jobs:
  powershell-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path outputs -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "Parser errors in $($_.FullName):"
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell parser errors detected.' }

      - name: Run non-mutating status checks
        shell: powershell
        run: |
          & '.\outputs\修复代理环境.ps1' -Action Status
          & '.\outputs\修复Codex重连.ps1' -Action Status
